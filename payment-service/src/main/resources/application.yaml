spring:
  config:
    import:
      - "optional:file:./deploy/compose/.env[.properties]"
      - "optional:file:../deploy/compose/.env[.properties]"
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:${DB_PORT:3307}/${DB_NAME:ticketnow_event}}
    username: ${DB_USERNAME:event_user}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ticketnow
          audiences:
            - ticketnow-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8085

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:3000/checkout/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/checkout/cancel}
  mock:
    delay-ms: ${MOCK_PAYMENT_DELAY_MS:0}
    auto-confirm: ${MOCK_PAYMENT_AUTO_CONFIRM:false}
  outbox:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
