spring:
  config:
    # Load the Compose .env as properties when launched from the repo or service directory.
    import:
      - "optional:file:./deploy/compose/.env[.properties]"
      - "optional:file:../deploy/compose/.env[.properties]"
  application:
    name: event-service
  datasource:
    url: ${EVENT_DB_URL:${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${EVENT_DB_NAME:${DB_NAME:ticketnow_event}}?createDatabaseIfNotExist=true}}
    username: ${EVENT_DB_USERNAME:${DB_USERNAME:event_user}}
    password: ${EVENT_DB_PASSWORD:${DB_PASSWORD}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:ticketnow}}
          audiences:
            - ticketnow-api
server:
  port: ${EVENT_SERVICE_PORT:8081}

seat-inventory:
  client: ${SEAT_INVENTORY_CLIENT:grpc}
  url: ${SEAT_INVENTORY_URL:http://localhost:8083}
  grpc:
    host: ${SEAT_INVENTORY_GRPC_HOST:localhost}
    port: ${SEAT_INVENTORY_GRPC_PORT:9083}
    deadline-ms: ${SEAT_INVENTORY_GRPC_DEADLINE_MS:5000}
