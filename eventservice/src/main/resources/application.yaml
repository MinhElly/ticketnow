spring:
  config:
    # Load the Compose .env as properties when launched from the repo or service directory.
    import:
      - "optional:file:./deploy/compose/.env[.properties]"
      - "optional:file:../deploy/compose/.env[.properties]"
  application:
    name: event-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:${DB_PORT:3307}/${DB_NAME:ticketnow_event}}
    username: ${DB_USERNAME:event_user}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
server:
  port: 8081
