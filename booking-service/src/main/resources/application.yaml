spring:
  config:
    import:
      - "optional:file:./deploy/compose/.env[.properties]"
      - "optional:file:../deploy/compose/.env[.properties]"
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${BOOKING_DB_NAME:ticketnow_booking}?createDatabaseIfNotExist=true}
    username: ${BOOKING_DB_USERNAME:${DB_ROOT_USERNAME:root}}
    password: ${BOOKING_DB_PASSWORD:${DB_ROOT_PASSWORD:${DB_PASSWORD}}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/${KEYCLOAK_REALM:ticketnow}}
          audiences:
            - ticketnow-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${BOOKING_SERVICE_PORT:8084}

seat-inventory:
  # grpc (default) | http | none. "none" is only used by tests with a mocked bean.
  client: ${SEAT_INVENTORY_CLIENT:grpc}
  url: ${SEAT_INVENTORY_URL:http://localhost:8083}
  grpc:
    host: ${SEAT_INVENTORY_GRPC_HOST:localhost}
    port: ${SEAT_INVENTORY_GRPC_PORT:9083}
    deadline-ms: ${SEAT_INVENTORY_GRPC_DEADLINE_MS:500}

booking:
  hold-ttl-seconds: ${BOOKING_HOLD_TTL_SECONDS:600}
  kafka:
    enabled: ${BOOKING_KAFKA_ENABLED:true}
    payment-events-topic: ${PAYMENT_EVENTS_TOPIC:payment.events}
