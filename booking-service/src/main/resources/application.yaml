spring:
  config:
    import:
      - "optional:file:./deploy/compose/.env[.properties]"
      - "optional:file:../deploy/compose/.env[.properties]"
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${BOOKING_DB_NAME:ticketnow_booking}?createDatabaseIfNotExist=true}
    username: ${BOOKING_DB_USERNAME:${DB_ROOT_USERNAME:root}}
    password: ${BOOKING_DB_PASSWORD:${DB_ROOT_PASSWORD:${DB_PASSWORD}}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ticketnow
          audiences:
            - ticketnow-api

server:
  port: 8084

seat-inventory:
  url: ${SEAT_INVENTORY_URL:http://localhost:8083}

booking:
  hold-ttl-seconds: ${BOOKING_HOLD_TTL_SECONDS:600}
