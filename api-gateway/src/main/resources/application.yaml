spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ticket-service
              uri: ${TICKET_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/tickets,/api/v1/tickets/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**
            - id: seat-inventory-service
              uri: ${SEAT_INVENTORY_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/events/*/seats,/api/v1/events/*/seats/**
            - id: event-service
              uri: ${EVENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/events,/api/v1/events/**,/api/v1/venues,/api/v1/venues/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ticketnow
          audiences:
            - ticketnow-api

server:
  port: 8080
