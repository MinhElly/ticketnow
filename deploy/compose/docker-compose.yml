name: ticketnow-infrastructure
services:
  mariadb:
    image: mariadb:12.3.3
    container_name: ticketnow-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-ticketnow_event}
      MARIADB_USER: ${DB_USERNAME:-event_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4-alpine
    container_name: ticketnow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: ticketnow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD}
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:-LocalDemo_2026}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
volumes:
  mariadb_data:
  redis_data:
  keycloak_data:
